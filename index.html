<script>try{var _t=localStorage.getItem("analyst-theme"),_ok={light:1,dark:1,anime:1,safari:1,ocean:1,sunset:1,arcade:1};if(!_ok[_t])_t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.dataset.theme=_t;if({dark:1,ocean:1,arcade:1}[_t])document.documentElement.dataset.dark="1"}catch(e){document.documentElement.dataset.theme="light"}</script>
<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#14232b;--mut:#5d6d77;--line:#dbe3e9;--acc:#2447d6;--accsoft:#e3e9fc;--ok:#16825d;--warn:#b7791f;--bad:#c2410c}
:root[data-theme=dark]{color-scheme:dark;--bg:#0e161b;--card:#16212a;--ink:#e8eef2;--mut:#93a4af;--line:#26343e;--acc:#7b97ff;--accsoft:#1d2a52;--ok:#4cc79b;--warn:#e0b04c;--bad:#f08a5d}
:root[data-theme=anime]{--bg:#fff0f8;--card:#fff;--ink:#33204a;--mut:#7d5f96;--line:#f3c9e2;--acc:#d92f8f;--accsoft:#ffe3f2;--ok:#0f8f6e;--warn:#a96a10;--bad:#d6452b}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px 48px}
main{max-width:760px;margin:0 auto}
header{padding:28px 0 8px}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;font-weight:800}
.sub{color:var(--mut);margin:0}
nav{display:flex;gap:4px;margin:16px 0;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-weight:700;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{color:var(--acc);border-bottom-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
section[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 10px}
.chart{display:flex;align-items:flex-end;gap:10px;height:120px;margin:6px 0 4px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center;font-size:12px;color:var(--mut)}
.bar{background:var(--accsoft);border-radius:4px 4px 0 0;position:relative;height:100%;overflow:hidden;display:flex;align-items:flex-end}
.bar i{display:block;width:100%;background:var(--acc);transition:height .4s}
.col b{display:block;margin-top:4px;color:var(--ink);font-size:13px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{flex:1;min-width:130px;background:var(--bg);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:13px;color:var(--mut)}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
label.ck:first-of-type{border-top:0}
input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--acc);flex:none}
label.ck.done span{color:var(--mut);text-decoration:line-through}
.next{background:var(--accsoft);border-radius:8px;padding:12px 14px}
.next small{color:var(--mut);display:block}
.ph-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ph-head small{color:var(--mut)}
.mini{height:6px;background:var(--line);border-radius:3px;margin:6px 0 8px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--ok)}
.ph-goal{font-size:14px;color:var(--mut);margin:0 0 6px}
form.add{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
form.add input,form.add select,.chips button,.btn{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
form.add .full{grid-column:1/-1}
.btn{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row small{color:var(--mut);display:block}
.row select{font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.x{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;padding:4px 8px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accsoft);color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{cursor:pointer;padding:6px 12px;font-weight:600}
.chips button[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
details.q{border-top:1px solid var(--line);padding:10px 0}

.empty{color:var(--mut);padding:8px 0}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}

details.pj[open]>summary{border-bottom:1px solid var(--line);margin-bottom:12px}

.ai{background:var(--accsoft);border-radius:8px;padding:10px 14px;margin-top:12px}

.say{border-left:3px solid var(--acc);padding-left:12px;margin-top:12px;font-style:italic}

.cert h2{font-size:17px;margin:6px 0 4px}
.cert .meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.pill.free{background:#dff3ea;color:var(--ok)}
.pill.paid{background:#fbeccd;color:var(--warn)}
.pill.go{background:var(--acc);color:#fff}
[data-dark]{color-scheme:dark}[data-dark] .pill.free{background:#12332a}[data-dark] .pill.paid{background:#3a2d10}[data-dark] .btn,[data-dark] .pill.go,[data-dark] .chips button[aria-pressed=true],[data-dark] .themes button[aria-pressed=true]{color:var(--bg)}

.kw{display:flex;gap:6px;flex-wrap:wrap}
.kw a{border:1px solid var(--line);border-radius:99px;padding:4px 12px;text-decoration:none;color:var(--ink);font-size:14px;background:var(--card)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}

.one{margin-bottom:10px}

.chk li{list-style:none;margin:3px 0}

.ok{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}

.match span{display:inline-block;margin:2px 4px 2px 0;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}

@media print{@page{margin:14mm}body{background:#fff;padding:0}header,nav,.foot,.noprint,main>p.note,main>section:not(#t-resume){display:none!important}#t-resume>*:not(.rwrap){display:none!important}.rwrap{border:0!important;padding:0!important;margin:0!important;background:#fff!important}#rpage{border:0;padding:0;font-size:12px}}

.themes button[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.jp{display:none;font-size:13px;color:var(--acc);font-weight:800;margin-left:8px}
:root:not([data-theme=light]):not([data-theme=dark]) .jp{display:inline}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

.mas{display:flex;gap:14px;align-items:center}
.mas>button{background:none;border:0;padding:0;cursor:pointer;flex:none}
.bubble{flex:1;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px}
.bubble b{display:block;margin-bottom:2px}
.xp{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0}
.xp i{display:block;height:100%;background:var(--ok);transition:width .5s}
.bg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{text-align:center;padding:10px 6px;border-radius:10px;background:var(--bg);font-size:13px}
.bd .e{font-size:26px;display:block}
.bd small{color:var(--mut);display:block;line-height:1.3}
.bd.lock{opacity:.4;filter:grayscale(1)}
.tm{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin:0 12px 0 0}
.rowf{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:all .3s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:40}
.pt{position:fixed;pointer-events:none;z-index:1;opacity:.8}
.pt.petal{top:-20px;background:#ffb3d6;border-radius:100% 0 100% 0;animation:fall linear infinite}
.pt.leaf{top:-20px;background:#7fbf7a;border-radius:0 100% 0 100%;animation:fall linear infinite}
.pt.bubble{bottom:-30px;border:2px solid rgba(160,230,240,.6);background:rgba(160,230,240,.12);border-radius:50%;animation:rise linear infinite}
@keyframes rise{from{transform:translate(0,0)}to{transform:translate(24px,-112vh)}}
@keyframes fall{from{transform:translate(0,-5vh) rotate(0)}to{transform:translate(60px,108vh) rotate(420deg)}}
[data-theme=anime] body{background:linear-gradient(160deg,#ffe9f6 0%,#efe8ff 55%,#e3f1ff 100%) fixed;font-family:"M PLUS Rounded 1c","Plus Jakarta Sans",system-ui,sans-serif}

:root[data-theme=safari]{--bg:#eef5ea;--card:#fffef9;--ink:#1f3324;--mut:#587058;--line:#cfe0c8;--acc:#2a7547;--accsoft:#dcefd9;--ok:#2a7547;--warn:#a8741a;--bad:#b4462f}

<body>
<main>
<header>
  <h1>Analyst Track<span class="jp" id="tag"></span></h1>
  <p class="sub">One goal: a data analyst job. SQL, Power BI, projects, applications. Nothing else.</p>
  <div class="themes" role="group" aria-label="Theme"><button data-theme-btn="light">☀️ Light</button><button data-theme-btn="dark">🌙 Dark</button><button data-theme-btn="anime">🌸 Anime</button><button data-theme-btn="safari">🌿 Safari</button><button data-theme-btn="ocean">🌊 Ocean</button><button data-theme-btn="sunset">🌅 Sunset</button><button data-theme-btn="arcade">🕹️ Arcade</button></div>
</header>
<nav role="tablist" id="tabs"></nav>

<section id="t-today"></section>
<section id="t-plan" hidden></section>
<section id="t-proj" hidden></section>
<section id="t-certs" hidden></section>
<section id="t-kit" hidden></section>
<section id="t-resume" hidden></section>
<section id="t-apps" hidden></section>
<section id="t-prep" hidden></section>

<div class="foot">
  <button class="btn ghost" id="exp">Download backup</button>
  <button class="btn ghost" id="imp">Restore backup</button>
  <button class="btn ghost" id="rst">Reset everything</button>
  <input type="file" id="file" accept="application/json" hidden>
</div>
<p class="note">Progress is saved in this browser only. Download a backup now and then, and use the same browser and device each time. The backup includes her resume details, so keep it private.</p>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="cf" aria-hidden="true"></canvas>

<script>
const PLAN=[
{t:"SQL",w:"Weeks 1–4",g:"Write joins and aggregations without looking up the syntax.",k:[
"SELECT, WHERE, ORDER BY, LIMIT",
"GROUP BY, HAVING and aggregate functions",
"INNER and LEFT JOIN on two or three tables",
"Subqueries and CTEs (WITH)",
"CASE WHEN and date functions",
"Window functions: ROW_NUMBER, RANK, running totals",
"Solve 40 easy and medium SQL problems (HackerRank, LeetCode)",
"Earn the HackerRank SQL (Basic) certificate"]},
{t:"Excel and Power Query",w:"Weeks 3–5",g:"Clean a messy file and summarise it in under 30 minutes.",k:[
"Pivot tables and slicers",
"XLOOKUP, INDEX/MATCH, SUMIFS, COUNTIFS",
"Clean data with Power Query (split, merge, unpivot, change types)",
"Build one Excel dashboard from raw data"]},
{t:"Power BI and DAX",w:"Weeks 4–9",g:"Build a clean report on a star schema and explain every measure.",k:[
"Star schema, relationships, one-to-many",
"Measures vs calculated columns",
"CALCULATE and FILTER",
"Time intelligence: YTD, previous year, month-on-month",
"Row-level security basics",
"Publish a report to Power BI Service",
"Finish the Microsoft Learn PL-300 learning path",
"Pass the free practice assessment above 80%",
"Take the PL-300 exam"]},
{t:"Python basics (light)",w:"Weeks 6–8",g:"Load a CSV, filter, group and plot with pandas.",k:[
"Read a CSV into pandas",
"Filter, sort, groupby, merge",
"Handle missing values and duplicates",
"One chart with matplotlib or seaborn"]},
{t:"Portfolio",w:"Weeks 4–12",g:"Three projects, each with a problem, a dashboard and written insights.",k:[
"Finish Project 1 (retail sales) from the Projects tab",
"Finish Project 2 (the automated weekly report) from the Projects tab",
"Finish Project 3 (AI accuracy log) from the Projects tab",
"Write a one-page summary for each project: problem, method, 3 insights",
"Publish the dashboards and put links on GitHub and LinkedIn"]},
{t:"Profile and resume",w:"Weeks 6–8",g:"A recruiter understands her pitch in ten seconds.",k:[
"LinkedIn headline: Data Analyst | SQL | Power BI | Excel",
"One-page resume with projects first and numbers in every bullet",
"Add the zoology + MCA story to the summary",
"Add one line: I use AI tools to write and debug queries, then verify the results",
"Ask two people to review the resume"]},
{t:"Job hunt",w:"From week 8",g:"A steady flow of applications and follow-ups.",k:[
"Apply to 5 jobs a day on LinkedIn, Naukri, Indeed and Foundit",
"Message 5 analysts or recruiters a week with a short, polite note",
"Apply to MIS, reporting, BI and junior analyst roles, not just the title Data Analyst",
"Do 3 mock interviews",
"Review rejections or silence every two weeks and adjust"]}];

const QS=[
["SQL","What is the difference between INNER JOIN and LEFT JOIN?","INNER JOIN returns only rows with a match in both tables. LEFT JOIN returns all rows from the left table, plus matching rows from the right; unmatched right-side columns are NULL."],
["SQL","WHERE vs HAVING?","WHERE filters rows before grouping. HAVING filters groups after aggregation, e.g. HAVING COUNT(*) > 5."],
["SQL","Find the second highest salary.","SELECT MAX(salary) FROM emp WHERE salary < (SELECT MAX(salary) FROM emp);\nOr use DENSE_RANK() OVER (ORDER BY salary DESC) and pick rank 2."],
["SQL","What is a CTE and when do you use it?","A named temporary result set defined with WITH. It makes long queries readable and lets you reuse the same step in the query."],
["SQL","ROW_NUMBER vs RANK vs DENSE_RANK?","ROW_NUMBER gives unique numbers. RANK gives ties the same number and skips the next ones (1,1,3). DENSE_RANK gives ties the same number without gaps (1,1,2)."],
["SQL","How do you find duplicate rows?","SELECT col, COUNT(*) FROM t GROUP BY col HAVING COUNT(*) > 1;"],
["Excel","VLOOKUP vs XLOOKUP?","XLOOKUP can look left, defaults to exact match, returns a custom value when nothing is found, and does not break when columns are inserted. VLOOKUP needs a column index and only looks right."],
["Excel","How would you clean a messy dataset in Excel?","Remove duplicates, trim spaces, fix data types, handle blanks, standardise text, and do it in Power Query so the steps repeat when new data arrives."],
["Power BI","Calculated column vs measure?","A calculated column is computed row by row at refresh and stored in the model. A measure is computed at query time based on filter context and doesn’t add stored data. Use measures for aggregations."],
["Power BI","What is filter context?","The set of filters (slicers, visual axes, page filters) applied when a measure is evaluated. CALCULATE can change it."],
["Power BI","Import vs DirectQuery?","Import loads a compressed copy into the model: fast, but needs refresh. DirectQuery queries the source live: fresher data, but slower and with some DAX limits."],
["Power BI","Why use a star schema?","One fact table linked to small dimension tables gives faster performance, simpler DAX and fewer relationship ambiguities."],
["Power BI","How do you calculate year-over-year growth?","Create a base measure, e.g. Sales = SUM(Sales[Amount]). Then PY = CALCULATE([Sales], SAMEPERIODLASTYEAR('Date'[Date])) and growth = DIVIDE([Sales]-[PY],[PY]). Use a proper date table."],
["Analytics","Sales dropped 15% last month. How would you investigate?","Confirm the data is correct. Then break it down by product, region, channel, customer type and time. Compare with the previous period and last year. Look for one segment driving most of the drop, then suggest a next step."],
["Analytics","Walk me through one of your projects.","Use this order: the business question, the data and its problems, what you did, the 3 key insights, and what action you would recommend. Keep it under two minutes."],
["Analytics","How do you handle missing values?","First understand why they are missing. Then remove, fill (mean, median, a default) or flag them, depending on how much is missing and how it affects the analysis. Always say what you did."],
["Statistics","Mean vs median. When do you use each?","Mean is the average and is pulled by extreme values. Median is the middle value and is not. Use median for skewed data such as salaries or order values."],
["Statistics","Correlation vs causation?","Correlation means two things move together. Causation means one produces the other. Ice cream sales and heat are correlated, but sales don’t cause heat. Use experiments or controlled comparisons to claim causation."],
["Statistics","How do you spot and handle outliers?","Use a box plot, percentiles or the 1.5×IQR rule. Check whether it is a data error or a real extreme value. Fix errors, keep real values, and report results with and without them if they matter."],
["Statistics","What is an A/B test?","Two versions (A and B) are shown to similar random groups, and a metric such as conversion is compared. A significance test checks whether the difference is likely real or just chance."],
["Python","merge vs concat in pandas?","merge joins tables on keys, like a SQL join. concat stacks tables on top of each other (rows) or side by side (columns)."],
["Python","loc vs iloc?","loc selects by label (row index values and column names). iloc selects by integer position."],
["Power BI","Slicer vs filter?","A slicer is a visible control that users click to filter. Filters in the filter pane are set by the report author at visual, page or report level and are not always visible."],
["Power BI","What is row-level security?","It restricts which rows a user can see, using roles with DAX filters. For example, a regional manager sees only their own region’s data."],
["Analytics","How do you choose KPIs for a dashboard?","Start from the decision the viewer needs to make. Pick a few measures tied to that goal, show trend and comparison to target, and drop anything nobody would act on."],
["Behavioural","You are from a zoology background. Why analytics?","I enjoy finding patterns in data, and my degree trained me in research, observation and drawing conclusions. MCA gave me the technical base, and I have since built projects in SQL and Power BI."],

function tick(){tm.left=Math.max(0,Math.round((tm.end-Date.now())/1000));const e=$("tm");if(e)e.textContent=fmt(tm.left);
  if(tm.left<=0){clearInterval(tm.iv);tm.iv=null;tm.left=1500;S.sprints=(S.sprints||0)+1;save();toast("Sprint done! +5 XP. Take a 5-minute break.");confetti(60);if(cur==="today")refresh()}}
function questToday(){const d=new Date();return QUESTS[Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate())/864e5)%QUESTS.length]}
function renderToday(){
  const t=totalStats(),pct=Math.round(t.d/t.n*100),day=S.daily[today()]||{},nx=nextTask(),L=levelInfo();
  const n4=[0,1,2,3].filter(i=>day[i]).length,st=streak(),anime=document.documentElement.dataset.theme==="anime";
  let msg=n4===4?"All four done today! Mochi is doing a happy dance.":n4>0?n4+" of 4 done. Keep going, you’re on a roll!":st>0?"Your streak is at "+st+" day"+(st>1?"s":"")+". One small task keeps it alive.":"Hi! Pick one small thing today. SQL practice is a great start.";
  if(bubble)msg=bubble;else if(anime)msg+=" Ganbatte!";
  const bars=PLAN.map((p,i)=>{const s=phaseStats(i);const h=Math.round(s.d/s.n*100);return `<div class="col"><div class="bar" title="${esc(p.t)}"><i style="height:${h}%"></i></div><b>${h}%</b>${esc(p.t.split(" ")[0])}</div>`}).join("");
  const unl=ACH.filter(a=>S.ach[a.id]).length,qd=day.q;
  const run=!!tm.iv;
  let qhtml="";
  if(qr){qhtml=`<div class="next"><small>${esc(QS[qr.i][0])}</small><b>${esc(QS[qr.i][1])}</b></div>`+(qr.show?`<div class="a" style="margin:10px 0;padding:12px;background:var(--bg);border-radius:8px;white-space:pre-wrap;font-size:15px">${esc(QS[qr.i][2])}</div><p class="rowf" style="margin:0"><button class="btn" data-act="qgot">I knew it (+3 XP)</button><button class="btn ghost" data-act="qnot">Not yet</button></p>`:`<p style="margin:10px 0 0"><button class="btn" data-act="qshow">Show answer</button></p>`)}
  else qhtml=`<p style="margin:0 0 10px">Get one random interview question. Say the answer out loud first.</p><button class="btn" data-act="qask">Ask me one</button>`;
  $("t-today").innerHTML=`
  <div class="card"><div class="mas"><button data-act="mochi" aria-label="Tap Mochi for a joke">${mochi(n4>0)}</button>
    <div class="bubble"><b>Level ${L.i+1}: ${esc(L.name)}</b><div class="xp" role="img" aria-label="${L.pct}% to next level"><i style="width:${L.pct}%"></i></div>
    <small class="sub">${L.x} XP${L.nx?" · "+(L.nx-L.x)+" to next level":" · max level"}</small><p style="margin:8px 0 0">${esc(msg)}</p></div></div>
    <p class="note" style="margin-bottom:0">Tap Mochi for a joke. XP: roadmap step 10, project step 15, daily task 5, application 8, practised question 3, certificate 100.</p></div>
  <div class="card"><h2>Overall progress: ${pct}%</h2>
    <div class="chart" role="img" aria-label="Progress by phase">${bars}</div>
    <div class="stats">
      <div class="stat"><b>${st}</b><span>day streak</span></div>
      <div class="stat"><b>${appsThisWeek()}</b><span>applications in the last 7 days</span></div>
      <div class="stat"><b>${S.apps.filter(a=>a.status==="Interview").length}</b><span>interviews in progress</span></div>
      <div class="stat"><b>${PROJ.filter((_,i)=>projDone(i)).length}/${PROJ.length}</b><span>projects finished</span></div>
    </div></div>
  <div class="card"><h2>Today’s four things</h2>
    ${DAILY.map((d,i)=>`<label class="ck ${day[i]?"done":""}"><input type="checkbox" data-daily="${i}" ${day[i]?"checked":""}><span>${esc(d)}</span></label>`).join("")}
    <p class="note">Do these four on most days and the rest follows. Missing a day is fine; the streak counts days with at least one item done.</p></div>
  <div class="card"><h2>Quest of the day</h2>
    <label class="ck ${qd?"done":""}"><input type="checkbox" data-daily="q" ${qd?"checked":""}><span>${esc(questToday())}</span></label></div>
  <div class="card"><h2>Focus sprint</h2><div class="rowf"><p class="tm" id="tm" aria-live="off">${fmt(tm.left)}</p>
    <button class="btn" data-act="tstart">${run?"Pause":"Start 25 min"}</button><button class="btn ghost" data-act="treset">Reset</button></div>
    <p class="note">Phone away, one task only. Each finished sprint gives 5 XP. Sprints done: ${S.sprints||0}.</p></div>
  <div class="card"><h2>Quick interview round</h2>${qhtml}</div>
  ${dueApps().length?`<div class="card"><h2>Follow-ups due (${dueApps().length})</h2><p style="margin:0 0 6px">These applications are a week old with no update. Send a short follow-up (template in the Toolkit tab), then change the status when you hear back.</p>${dueApps().slice(0,5).map(a=>`<p style="margin:4px 0"><b>${esc(a.company)}</b> · ${esc(a.role)}</p>`).join("")}</div>`:""}
  <div class="card"><h2>Next topic to learn</h2>
    ${nx?`<div class="next"><small>${esc(PLAN[nx.p].t)}</small><b>${esc(nx.t)}</b></div><p><button class="btn" data-finish="${ids(nx.p,nx.i)}">Mark as done</button></p>`:`<div class="next"><b>Every topic is done. Keep applying and keep practising interviews.</b></div>`}
  </div>
  <div class="card"><h2>Badges: ${unl}/${ACH.length}</h2><div class="bg">${ACH.map(a=>`<div class="bd ${S.ach[a.id]?"":"lock"}" title="${esc(a.d)}"><span class="e">${a.e}</span>${esc(a.n)}<small>${esc(a.d)}</small></div>`).join("")}</div></div>`;
}
function renderPlan(){
  $("t-plan").innerHTML=PLAN.map((p,pi)=>{const s=phaseStats(pi);return `<div class="card">
    <div class="ph-head"><h2>${esc(p.t)}</h2><small>${esc(p.w)} · ${s.d}/${s.n}</small></div>
    <div class="mini"><i style="width:${s.d/s.n*100}%"></i></div>
    <p class="ph-goal">Goal: ${esc(p.g)}</p>
    ${p.k.map((k,i)=>{const id=ids(pi,i),on=S.done[id];return `<label class="ck ${on?"done":""}"><input type="checkbox" data-task="${id}" ${on?"checked":""}><span>${esc(k)}</span></label>`}).join("")}
  </div>`}).join("");
}

function renderApps(){
  const counts=ST.map(s=>`${s}: ${S.apps.filter(a=>a.status===s).length}`).join(" · ");
  $("t-apps").innerHTML=`<div class="card"><h2>Add a job</h2>
    <form class="add" id="appform">
      <input name="company" placeholder="Company" required aria-label="Company">
      <input name="role" placeholder="Role" required aria-label="Role">
      <input class="full" name="link" placeholder="Job link (optional)" aria-label="Job link">
      <select name="status" aria-label="Status">${ST.map(s=>`<option ${s==="Applied"?"selected":""}>${s}</option>`).join("")}</select>
      <button class="btn" type="submit">Add job</button>
    </form></div>
  <div class="card"><h2>Your applications (${S.apps.length})</h2>
    <p class="note" style="margin-top:0">${counts}</p>
    ${S.apps.length?S.apps.map(a=>`<div class="row"><div><b>${a.link?`<a href="${esc(a.link)}" target="_blank" rel="noopener" style="color:inherit">${esc(a.company)}</a>`:esc(a.company)}</b><small>${esc(a.role)} · ${new Date(a.ts).toLocaleDateString()}${a.status==="Applied"&&Date.now()-a.ts>=7*864e5?` · <b style="color:var(--bad)">Follow up now</b>`:""}</small></div>
      <select data-st="${a.id}" aria-label="Status for ${esc(a.company)}">${ST.map(s=>`<option ${s===a.status?"selected":""}>${s}</option>`).join("")}</select>
      <button class="x" data-del="${a.id}" aria-label="Delete ${esc(a.company)}">×</button></div>`).join(""):`<p class="empty">No jobs yet. Add the first one you apply to.</p>`}
  </div>`;
}

let cat="All";
function renderPrep(){
  const cats=["All","SQL","Excel","Power BI","Statistics","Python","Analytics","Behavioural"];
  const list=QS.map((q,i)=>({q,i})).filter(o=>cat==="All"||o.q[0]===cat);
  const pr=Object.keys(S.prac).filter(k=>S.prac[k]).length;
  $("t-prep").innerHTML=`<div class="card"><h2>Interview questions · ${pr}/${QS.length} practised</h2>
    <div class="chips">${cats.map(c=>`<button data-cat="${c}" aria-pressed="${c===cat}">${c}</button>`).join("")}</div>
    ${list.map(({q,i})=>`<details class="q"><summary><span>${esc(q[1])}</span><span class="tag">${esc(q[0])}${S.prac[i]?" · practised":""}</span></summary>
      <div class="a">${esc(q[2])}</div>
      <label class="ck"><input type="checkbox" data-prac="${i}" ${S.prac[i]?"checked":""}><span>I can answer this in my own words</span></label></details>`).join("")}
    <p class="note">Read the question, answer it aloud first, then open the answer. Say it in your own words and give an example from her projects.</p></div>`;
}

const TABS=[["today","Today",renderToday],["plan","Roadmap",renderPlan],["proj","Projects",renderProj],["certs","Certificates",renderCerts],["kit","Toolkit",renderKit],["resume","Resume",renderResume],["apps","Applications",renderApps],["prep","Interview prep",renderPrep]];
let cur="today";
function show(id){
  cur=id;bubble=null;
  TABS.forEach(([k,,fn])=>{$("t-"+k).hidden=k!==id;if(k===id)fn()});
  $("tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${k===id}">${l}</button>`).join("");
}
function refresh(){const f=TABS.find(t=>t[0]===cur)[2];const y=window.scrollY;f();window.scrollTo(0,y)}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab)show(b.dataset.tab);
  else if(b.dataset.act==="print"){window.print()}
  else if(b.dataset.act==="mochi"){bubble=JOKES[Math.floor(Math.random()*JOKES.length)];refresh()}
  else if(b.dataset.act==="tstart"){if(tm.iv){clearInterval(tm.iv);tm.iv=null}else{tm.end=Date.now()+tm.left*1000;tm.iv=setInterval(tick,1000)}refresh()}
  else if(b.dataset.act==="treset"){clearInterval(tm.iv);tm.iv=null;tm.left=1500;refresh()}
  else if(b.dataset.act==="qask"){const un=QS.map((_,i)=>i).filter(i=>!S.prac[i]),pool=un.length?un:QS.map((_,i)=>i);qr={i:pool[Math.floor(Math.random()*pool.length)],show:false};refresh()}
  else if(b.dataset.act==="qshow"){qr.show=true;refresh()}
  else if(b.dataset.act==="qgot"){S.prac[qr.i]=true;qr=null;save();toast("Nice! +3 XP");refresh()}
  else if(b.dataset.act==="qnot"){qr=null;refresh()}
  else if(b.dataset.themeBtn){}
  else if(b.dataset.act==="sug"){R().summary=resModel().sug;save();renderResume()}
  else if(b.dataset.act==="prompt"){const m=resModel();copyTo(aiPrompt(m,modelText(m)),()=>{copied=-2;renderResume();copied=-1})}
  else if(b.dataset.cf){cf=b.dataset.cf;refresh()}
  else if(b.dataset.copy!==undefined){const i=+b.dataset.copy,txt=TPL[i][1];const done=()=>{copied=i;const o=[...document.querySelectorAll("#t-kit details.q")].map(d=>d.open);renderKit();document.querySelectorAll("#t-kit details.q").forEach((d,j)=>{d.open=o[j]})};(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(done).catch(()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}ta.remove();done()})}
  else if(b.dataset.cat){cat=b.dataset.cat;refresh()}
  else if(b.dataset.finish){S.done[b.dataset.finish]=true;save();refresh()}
  else if(b.dataset.del){S.apps=S.apps.filter(a=>a.id!==b.dataset.del);save();refresh()}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.pj!==undefined){const i=+d.dataset.pj;d.open?openPj.add(i):openPj.delete(i)}},true);
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.r){S.res[t.dataset.r]=t.value;save();updateResume()}
  else if(t.dataset.rp){const a=t.dataset.rp.split(".");S.pres[a[0]]=S.pres[a[0]]||{};S.pres[a[0]][a[1]]=t.value;save();updateResume()}});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.daily!==undefined){const k=today();S.daily[k]=S.daily[k]||{};S.daily[k][t.dataset.daily]=t.checked;save();if(t.checked&&allFour(k))confetti(80);refresh()}
  else if(t.dataset.cert){S.cert[t.dataset.cert]=t.value;save();refresh()}
  else if(t.dataset.pstep){S.proj[t.dataset.pstep]=t.checked;save();refresh()}
  else if(t.dataset.task){S.done[t.dataset.task]=t.checked;save();refresh()}
  else if(t.dataset.prac!==undefined){S.prac[t.dataset.prac]=t.checked;save();const open=[...document.querySelectorAll("details.q[open] summary span:first-child")].map(s=>s.textContent);refresh();document.querySelectorAll("details.q").forEach(d=>{if(open.includes(d.querySelector("summary span").textContent))d.open=true})}
  else if(t.dataset.st){const a=S.apps.find(x=>x.id===t.dataset.st);if(a){a.status=t.value;if(t.value==="Applied")a.ts=Date.now();save();refresh()}}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="appform")return;e.preventDefault();
  const f=new FormData(e.target);let link=(f.get("link")||"").trim();
  if(link&&!/^https?:\/\//i.test(link))link="https://"+link;
  S.apps.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),company:f.get("company").trim(),role:f.get("role").trim(),link,status:f.get("status"),ts:Date.now()});
  save();refresh();
});

$("exp").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));
  a.download="analyst-track-backup-"+today()+".json";a.click();URL.revokeObjectURL(a.href);
};
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=="object"||!d.done||!Array.isArray(d.apps))throw 0;S={done:d.done,daily:d.daily||{},apps:d.apps,prac:d.prac||{},proj:d.proj||{},cert:d.cert||{},res:d.res||{},pres:d.pres||{},ach:{},lv:0,sprints:d.sprints||0};fix();sync(true);save();refresh()}catch(x){alert("That file is not a valid backup.")}};
  r.readAsText(f);e.target.value="";
};
$("rst").onclick=()=>{if(confirm("Delete all progress and applications? This cannot be undone.")){S={done:{},daily:{},apps:[],prac:{},proj:{},cert:{},res:{},pres:{},ach:{},lv:0,sprints:0};save();refresh()}};

document.addEventListener("click",e=>{const b=e.target.closest("[data-theme-btn]");if(b){setTheme(b.dataset.themeBtn);if(cur==="today"||cur==="resume")refresh()}});
fix();sync(true);save();
setTheme(document.documentElement.dataset.theme||"light");
show("today");
</script>
</body>
</html>
